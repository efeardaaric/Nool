plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.example.nool"
    // Android 16 (API 36+) — keep compile/target aligned with Play requirements
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Replace with your real applicationId before Play Store publish
        // (changing it creates a new app listing).
        applicationId = "com.example.nool"
        // Flutter 3.x default is 24; camera_android needs 23+, geolocator_android 24+
        minSdk = Math.max(flutter.minSdkVersion as Integer, 24)
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // Multidex is built into ART for minSdk >= 21 — no multidex library needed
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            // TODO: Add your own signing config for Play uploads.
            // Debug keys keep `flutter run --release` working locally.
            signingConfig = signingConfigs.debug

            // R8 minify + resource shrink — keep rules in proguard-rules.pro
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    packaging {
        jniLibs {
            // Compressed native libs → smaller APK / Play download (AGP 8+)
            useLegacyPackaging = false
        }
    }
}

flutter {
    source = "../.."
}
